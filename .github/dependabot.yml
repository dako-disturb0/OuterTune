version: 2
updates:
  # Gradle dependencies declared in gradle/libs.versions.toml
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
    groups:
      androidx-compose:
        patterns:
          - "androidx.compose*"
      androidx-media3:
        patterns:
          - "androidx.media3*"
      androidx-room:
        patterns:
          - "androidx.room*"
      ktor:
        patterns:
          - "io.ktor*"
    ignore:
      # AGP is mirrored into the media submodule by the workflows' patch step;
      # a bump here needs that submodule verified in the same change.
      - dependency-name: "com.android.tools.build:gradle"
      # Kotlin, KSP, Hilt and the Compose compiler plugin are version-locked to
      # each other, so they have to move together rather than one PR at a time.
      - dependency-name: "org.jetbrains.kotlin*"
      - dependency-name: "com.google.devtools.ksp*"
      - dependency-name: "com.google.dagger*"

  # GitHub Actions used by the build, pre-release and release workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"
