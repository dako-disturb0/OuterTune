name: Build APKs for release

on:
  workflow_dispatch:
    inputs:
      abi:
        description: "ABI (arsitektur CPU)"
        required: true
        default: "mix"
        type: choice
        options:
          - arm64-v8a
          - armeabi-v7a
          - mix
      flavor:
        description: "Build Variant / Flavor"
        required: true
        default: "mix"
        type: choice
        options:
          - core
          - full
          - mix
      add_to_release_tag:
        description: "Add to GitHub Release Tag?"
        required: true
        default: "true"
        type: boolean
      tag_name:
        description: "Release Tag Name (contoh: v1.0.0) — kosongkan untuk auto"
        required: false
        default: ""
      prerelease:
        description: "Tandai sebagai Pre-release?"
        required: false
        default: "false"
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release APKs
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Patch submodules AGP version
        run: |
          AGP=$(sed -n 's/^androidGradlePlugin = "\(.*\)"$/\1/p' gradle/libs.versions.toml)
          test -n "$AGP" || { echo "could not read androidGradlePlugin from version catalog"; exit 1; }
          echo "pinning media submodule AGP to $AGP"
          sed -i "s|classpath 'com.android.tools.build:gradle:[^']*'|classpath 'com.android.tools.build:gradle:$AGP'|" media/build.gradle
          grep -n 'com.android.tools.build:gradle' media/build.gradle

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: "temurin"
          cache: 'gradle'

      - name: Accept SDK licenses
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Install CMake 3.31.6
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "cmake;3.31.6"

      - name: Setup signing configs
        run: |
          echo "$KEYSTORE" | base64 --decode > test.jks
          echo "$KEYSTORE_PROPERTIES" > keystore.properties
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_PROPERTIES: ${{ secrets.KEYSTORE_PROPERTIES }}

      - name: Patch ABI splits in build.gradle.kts
        run: |
          ABI="${{ inputs.abi }}"
          if [ "$ABI" = "mix" ]; then
            INCLUDE_LINE='            include("arm64-v8a", "armeabi-v7a")'
          else
            INCLUDE_LINE="            include(\"$ABI\")"
          fi
          python3 - app/build.gradle.kts "$INCLUDE_LINE" <<'PYEOF'
          import sys, re
          path, new_include = sys.argv[1], sys.argv[2]
          content = open(path).read()
          content = re.sub(
              r'(splits\s*\{[^}]*abi\s*\{[^}]*?)([ \t]*include\([^)]*\))',
              lambda m: m.group(1) + new_include,
              content, flags=re.DOTALL
          )
          open(path, 'w').write(content)
          print(f"ABI include updated: {new_include.strip()}")
          PYEOF

      - name: Get version & date string
        id: meta
        run: |
          VERSION=$(sed -n 's/.*versionName\s*=\s*"\(.*\)".*/\1/p' app/build.gradle.kts | head -1)
          DATE_TAG=$(date +'%Y-%m-%d_%H-%M-%S')
          echo "version=$VERSION" >> $GITHUB_ENV
          echo "date_tag=$DATE_TAG" >> $GITHUB_ENV
          # Determine tag name
          RAW_TAG="${{ inputs.tag_name }}"
          FINAL_TAG="${RAW_TAG:-build-${DATE_TAG}}"
          echo "final_tag=$FINAL_TAG" >> $GITHUB_ENV

      - name: Resolve ffmpeg libs (for full flavor)
        if: ${{ inputs.flavor == 'full' || inputs.flavor == 'mix' }}
        run: git clone https://github.com/mikooomich/ffmpeg-android-maker-prebuilt/ -b audio ffMetadataEx/ffmpeg-android-maker

      - name: Build core release APK
        if: ${{ inputs.flavor == 'core' || inputs.flavor == 'mix' }}
        run: ./gradlew assembleCoreRelease

      - name: Build full release APK
        if: ${{ inputs.flavor == 'full' || inputs.flavor == 'mix' }}
        run: ./gradlew assembleFullRelease

      - name: Upload release APKs (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: release-apks-${{ env.date_tag }}-abi_${{ inputs.abi }}-flavor_${{ inputs.flavor }}
          path: |
            app/build/outputs/apk/core/release/*.apk
            app/build/outputs/apk/full/release/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Create GitHub Release
        if: ${{ inputs.add_to_release_tag == true || inputs.add_to_release_tag == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.final_tag }}
          name: "OuterTune ${{ env.version }} (${{ env.final_tag }})"
          draft: false
          prerelease: ${{ inputs.prerelease }}
          files: |
            app/build/outputs/apk/core/release/*.apk
            app/build/outputs/apk/full/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.REL_TOKEN || secrets.GITHUB_TOKEN }}
