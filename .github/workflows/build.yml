name: Build debug APK
on:
  workflow_dispatch:
  push:
    branches:
      - canary
      - dev
  pull_request:
    branches:
      - '**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Patch submodules AGP version
        run: |
          AGP=$(sed -n 's/^androidGradlePlugin = "\(.*\)"$/\1/p' gradle/libs.versions.toml)
          test -n "$AGP" || { echo "could not read androidGradlePlugin from version catalog"; exit 1; }
          echo "pinning media submodule AGP to $AGP"
          sed -i "s|classpath 'com.android.tools.build:gradle:[^']*'|classpath 'com.android.tools.build:gradle:$AGP'|" media/build.gradle
          grep -n 'com.android.tools.build:gradle' media/build.gradle

      - name: set up JDK 21
        uses: actions/setup-java@v5.6.0
        with:
          java-version: 21
          distribution: "temurin"
          cache: 'gradle'

      - name: Accept SDK licenses
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Build debug APK and run jvm tests
        run: ./gradlew assembleCoreDebug lintCoreDebug testCoreDebugUnitTest --stacktrace -DskipFormatKtlint

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-coreDebug.*
          retention-days: 7
          if-no-files-found: warn

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: '**/build/reports/tests/'
          retention-days: 7
          if-no-files-found: warn

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: app/build/outputs/apk/core/debug/*.apk
          retention-days: 7
