name: Build debug APK

on:
  workflow_dispatch:
    inputs:
      abi:
        description: "ABI (arsitektur CPU)"
        required: true
        default: "mix"
        type: choice
        options:
          - arm64-v8a
          - armeabi-v7a
          - mix
      flavor:
        description: "Build Variant / Flavor"
        required: true
        default: "mix"
        type: choice
        options:
          - core
          - full
          - mix
  push:
    branches:
      - canary
      - dev
  pull_request:
    branches:
      - '**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Patch submodules AGP version
        run: |
          AGP=$(sed -n 's/^androidGradlePlugin = "\(.*\)"$/\1/p' gradle/libs.versions.toml)
          test -n "$AGP" || { echo "could not read androidGradlePlugin from version catalog"; exit 1; }
          echo "pinning media submodule AGP to $AGP"
          sed -i "s|classpath 'com.android.tools.build:gradle:[^']*'|classpath 'com.android.tools.build:gradle:$AGP'|" media/build.gradle
          grep -n 'com.android.tools.build:gradle' media/build.gradle

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: "temurin"
          cache: 'gradle'

      - name: Accept SDK licenses
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Patch ABI splits in build.gradle.kts
        run: |
          ABI="${{ inputs.abi || 'mix' }}"
          if [ "$ABI" = "mix" ]; then
            INCLUDE_LINE='            include("arm64-v8a", "armeabi-v7a")'
          else
            INCLUDE_LINE="            include(\"$ABI\")"
          fi
          python3 - app/build.gradle.kts "$INCLUDE_LINE" <<'PYEOF'
          import sys, re
          path, new_include = sys.argv[1], sys.argv[2]
          content = open(path).read()
          content = re.sub(
              r'(splits\s*\{[^}]*abi\s*\{[^}]*?)([ \t]*include\([^)]*\))',
              lambda m: m.group(1) + new_include,
              content, flags=re.DOTALL
          )
          open(path, 'w').write(content)
          print(f"ABI include updated: {new_include.strip()}")
          PYEOF

      - name: Resolve ffmpeg libs (for full flavor)
        if: ${{ inputs.flavor == 'full' || inputs.flavor == 'mix' || github.event_name != 'workflow_dispatch' }}
        run: git clone https://github.com/mikooomich/ffmpeg-android-maker-prebuilt/ -b audio ffMetadataEx/ffmpeg-android-maker

      - name: Build core debug APK & test
        if: ${{ inputs.flavor == 'core' || inputs.flavor == 'mix' || github.event_name != 'workflow_dispatch' }}
        run: ./gradlew assembleCoreDebug lintCoreDebug testCoreDebugUnitTest --stacktrace -DskipFormatKtlint

      - name: Build full debug APK
        if: ${{ inputs.flavor == 'full' || inputs.flavor == 'mix' }}
        run: ./gradlew assembleFullDebug --stacktrace -DskipFormatKtlint

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-*
          retention-days: 7
          if-no-files-found: warn

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: '**/build/reports/tests/'
          retention-days: 7
          if-no-files-found: warn

      - name: Upload Debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: debug-apks
          path: |
            app/build/outputs/apk/core/debug/*.apk
            app/build/outputs/apk/full/debug/*.apk
          retention-days: 7
